name: Scrape VC job boards

on:
  schedule:
    - cron: "23 * * * *"   # hourly (GitHub may delay a few minutes)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run scraper
        run: python scraper/scrape.py

      - name: Commit updated data
        run: |
          git config user.name "job-tracker-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data docs
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update jobs ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi

      - name: Notify on new roles (creates an issue -> you get an email)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          first_run=$(python -c "import json;print(json.load(open('data/status.json'))['first_run'])")
          count=$(python -c "import json;print(len(json.load(open('data/new_roles.json'))))")
          echo "first_run=$first_run new=$count"
          if [ "$first_run" = "True" ]; then
            echo "First run — skipping notification (everything is 'new')."
          elif [ "$count" -gt 0 ]; then
            python scraper/make_issue_body.py > issue_body.md
            gh issue create \
              --title "🆕 $count new role(s) — $(date -u +'%Y-%m-%d %H:%M UTC')" \
              --body-file issue_body.md
          else
            echo "No new roles this run."
          fi

name: Scrape VC job boards

on:
  schedule:
    - cron: "23 * * * *"   # hourly (GitHub may delay a few minutes)
  workflow_dispatch:
  push:
    paths:                  # code/config pushes auto-run the scraper;
      - "scraper/**"        # bot data commits (data/, docs/) do NOT re-trigger
      - "config.json"
      - "boards.json"
      - ".github/workflows/scrape.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60      # full Consider sweep across 29 boards needs headroom
    env:
      PYTHONUNBUFFERED: "1"  # stream per-board progress into the live log
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run scraper
        run: python scraper/scrape.py

      - name: Commit updated data
        run: |
          git config user.name "job-tracker-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data docs
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Update jobs ($(date -u +'%Y-%m-%d %H:%M UTC'))"

          # A full sweep takes ~40 min, and the checkout is taken at the start.
          # If anyone pushes during that window the remote has moved on and a
          # plain push is rejected. Rebase this data commit onto whatever is
          # there now and retry, with backoff.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $i."
              exit 0
            fi
            echo "Push rejected (attempt $i) — remote moved; rebasing."
            git fetch origin main
            if ! git rebase origin/main; then
              # Conflicts can only be in data/ or docs/data.json, which this run
              # just regenerated from scratch — so the freshly scraped copy wins.
              # During a rebase, --theirs is the commit being replayed (ours).
              echo "Rebase conflict in generated files — keeping this run's data."
              git checkout --theirs -- data docs 2>/dev/null || true
              git add -A data docs
              if ! GIT_EDITOR=true git rebase --continue; then
                git rebase --abort
                echo "::error::Rebase failed irrecoverably."
                exit 1
              fi
            fi
            sleep $((i * 5))
          done
          echo "::error::Could not push after 5 attempts."
          exit 1

      - name: Notify on new roles (creates an issue -> you get an email)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          first_run=$(python -c "import json;print(json.load(open('data/status.json'))['first_run'])")
          count=$(python -c "import json;print(len(json.load(open('data/new_roles.json'))))")
          echo "first_run=$first_run new=$count"
          if [ "$first_run" = "True" ]; then
            echo "First run — skipping notification (everything is 'new')."
          elif [ "$count" -gt 0 ]; then
            python scraper/make_issue_body.py > issue_body.md
            gh issue create \
              --title "🆕 $count new role(s) — $(date -u +'%Y-%m-%d %H:%M UTC')" \
              --body-file issue_body.md
          else
            echo "No new roles this run."
          fi
